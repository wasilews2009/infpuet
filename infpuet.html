<style>
/* Layout: робочий інструмент — ліва навігація розділів, праворуч панель фільтрів і таблиця/картки; інвентарний номер скрізь як «бирка». */
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --ok:#6fd598; --ok-bg:#163424; --warn:#f0b454; --warn-bg:#3a2b10; --bad:#ff8f86; --bad-bg:#40191a;
  --info:#8db6f2; --info-bg:#17293f; --idle:#a7b0bd; --idle-bg:#262d36;
  --paper:#f7f7f4; --paper-ink:#111111; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1615; --surface:#162120; --sunk:#1d2a28; --ink:#e4edeb; --muted:#98aaa6; --line:#2b3a37;
  --accent:#55c7b9; --accent-ink:#05211e; --accent-soft:#1b3935;

*{box-sizing:border-box}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.kb .lead{max-width:70ch}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 32px)}

.x{border:0;background:transparent;font-size:1.3rem;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}

.paperwrap{overflow-x:auto;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:16px}
.paper{background:var(--paper);color:var(--paper-ink);min-width:640px;max-width:900px;margin:0 auto;padding:32px 36px;font-family:"Times New Roman",Times,serif;font-size:13.5px;line-height:1.35;box-shadow:0 1px 6px rgba(0,0,0,.18)}

.paper .meta{text-align:center;margin-bottom:12px}
.paper table{font-size:12.5px}
.paper th,.paper td{border:1px solid #333;padding:4px 6px;color:#111;background:#fff;text-transform:none;letter-spacing:0;font-size:12.5px;cursor:default;white-space:normal}

.userbar{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}

.btn.sm{min-height:30px;padding:4px 9px;font-size:.82rem}
.bell{position:relative;flex:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.bell:hover{border-color:var(--accent)}

.bell .badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:.7rem;font-weight:600;display:grid;place-items:center;font-family:var(--f-mono)}

.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important;font-size:.92rem!important}

.logl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.logl .day{grid-template-columns:minmax(0,1fr);padding:14px 0 4px;border-bottom:0}
.logl .chg{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.iconrow{display:flex;gap:8px;flex:none}
nav a .cnt.hot{background:var(--bad);color:var(--surface);opacity:1;border-radius:99px;padding:1px 7px;font-weight:600}
.chat{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:480px}

td select{min-height:32px;padding:3px 8px}

  .app{grid-template-columns:minmax(0,1fr);gap:14px;padding-inline:16px;padding-block:14px 40px}

}
@media (prefers-reduced-motion:no-preference){ .btn,.rcard,nav a{transition:background .12s,border-color .12s} }

const K32=(()=>{const k=[];for(let n=2;k.length<64;n++){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}if(p)k.push(n)}return k})();
const frac=x=>((x-Math.floor(x))*4294967296)>>>0;const SK=K32.map(n=>frac(Math.cbrt(n))),SH=K32.slice(0,8).map(n=>frac(Math.sqrt(n)));
function sha256(str){const b=new TextEncoder().encode(str),l=b.length,n=((l+8)>>6)+1,w=new Uint32Array(n*16);
  for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-(i%4)*8);w[l>>2]|=0x80<<(24-(l%4)*8);w[n*16-1]=l*8;
  let h=SH.slice();const W=new Uint32Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let j=0;j<n;j++){for(let i=0;i<64;i++){if(i<16)W[i]=w[j*16+i];else{const a=W[i-15],c=W[i-2];W[i]=(W[i-16]+(r(a,7)^r(a,18)^(a>>>3))+W[i-7]+(r(c,17)^r(c,19)^(c>>>10)))>>>0}}
    let a=h[0],b2=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(let i=0;i<64;i++){const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+SK[i]+W[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c)^(b2&c)))>>>0;hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
    h=[h[0]+a,h[1]+b2,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(x=>x>>>0)}
  return h.map(x=>x.toString(16).padStart(8,'0')).join('')}
function pwHash(pw,salt){let h=sha256(salt+':'+pw);for(let i=0;i<4000;i++)h=sha256(h+salt);return h}
function newSalt(){const a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<12;i++)a[i]=Math.random()*256}return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}

      <p>Файл .xlsx з окремим аркушем для кожного розділу: аудиторії, техніка, ремонти, склад, програмне забезпечення, довідники, користувачі, повідомлення та журнал змін. Його можна відкрити й переглянути в Excel.</p>

function update(){const o=$('#out');if(!o)return;const v=F.view;
  if(v==='struktura'){o.innerHTML=kbHtml();return}
  if(conn!=='on'){o.innerHTML=`<div class="panel"><div class="empty">${conn==='off'?'База даних недоступна в цьому перегляді. Після входу в обліковий запис тут з’являться аудиторії, техніка, ремонти та склад.':'Завантаження даних…'}</div></div>`;return}
  ({oglyad:vOverview,audytorii:vRooms,tekhnika:vEq,remont:vRep,sklad:vStock,pz:vSoft,zvity:vReports,korystuvachi:vUsers,dovidnyky:vDict,spilkuvannia:vTalk,kopiia:vBackup})[v](o)}

/* ---------- Огляд ---------- */
function vOverview(o){
  const E=S.equipment,act=E.filter(e=>e.status!=='Списано'),inRep=E.filter(e=>e.status==='У ремонті'),need=E.filter(e=>e.status==='Потребує ремонту');
  const low=S.stock.filter(s=>Number(s.qty)<Number(s.min));
  const anyDemo=[...S.rooms,...E,...S.repairs,...S.stock,...S.software].some(x=>x.demo);
  $('#demoBar').innerHTML=anyDemo?`<div class="notice"><span>Показано демонстраційні записи з позначкою «демо». Це приклади, а не дані університету. Видаліть їх перед внесенням реального обліку.</span>${W()?'<button class="btn" id="delDemo">Видалити демо-записи</button>':''}</div>`:'';
  if(!E.length&&!S.rooms.length){o.innerHTML=`<div class="panel"><div class="empty">${loaded.rooms&&loaded.equipment?'База порожня. Почніть з розділу «Аудиторії», потім додайте техніку вручну або імпортуйте її з Excel у розділі «Техніка».':'Завантаження даних…'}</div></div>`;return}
  const byType={};act.forEach(e=>byType[e.type]=(byType[e.type]||0)+1);const tp=Object.entries(byType).sort((a,b)=>b[1]-a[1]);const mx=tp.length?tp[0][1]:1;
  const bySt=STATUSES.map(s=>[s,E.filter(e=>e.status===s).length]).filter(x=>x[1]);
  const att=[];
  activeRepairs().forEach(r=>{const e=eqBy.get(r.eqId),d=days(r.dateIn,today());if(d>14)att.push([pill(d+' дн. у ремонті','warn'),`${esc(e?e.name:'Техніка')} — ${esc(r.status.toLowerCase())}`,'remont'])});
  need.forEach(e=>att.push([pill('Потребує ремонту','bad'),`${esc(e.name)}, ${esc(roomLabel(eqRoom(e)))}${e.note?' — '+esc(e.note):''}`,'tekhnika']));
  low.forEach(s=>att.push([pill(Number(s.qty)<=0?'Немає на складі':'Закінчується','warn'),`${esc(s.name)}: ${esc(s.qty)} ${esc(s.unit||'')} при мінімумі ${esc(s.min)}`,'sklad']));
  S.software.forEach(w=>{if(w.expires){const d=days(today(),w.expires);if(d<=60)att.push([pill(d<0?'Ліцензія прострочена':'Ліцензія до '+dUA(w.expires),d<0?'bad':'warn'),esc(w.name),'pz'])}});
  const cs=corps().map(c=>{const rs=S.rooms.filter(r=>r.corp===c),ids=new Set(rs.map(r=>r.id)),es=E.filter(e=>ids.has(e.roomId));
    return {id:c,c,rooms:rs.length,units:es.length,rep:es.filter(e=>e.status==='У ремонті'||e.status==='Потребує ремонту').length}});
  o.innerHTML=`<div class="tiles">
    <a class="tile" href="#tekhnika"><b class="num">${act.length}</b><span>одиниць техніки на обліку</span></a>
    <a class="tile" href="#audytorii"><b class="num">${S.rooms.length}</b><span>аудиторій і приміщень</span></a>
    <a class="tile ${inRep.length?'caution':''}" href="#remont"><b class="num">${activeRepairs().length}</b><span>у ремонті зараз</span></a>
    <a class="tile ${need.length?'alert':''}" href="#tekhnika"><b class="num">${need.length}</b><span>потребують ремонту</span></a>
    <a class="tile ${low.length?'caution':''}" href="#sklad"><b class="num">${low.length}</b><span>позицій складу нижче мінімуму</span></a></div>
  <div class="cols2">
    <section class="panel"><header><h3>Техніка за типами</h3></header><div class="pad"><div class="bars">${tp.map(([t,n])=>`<div class="brow"><span>${esc(t)}</span><div class="trk"><i style="width:${Math.max(2,n/mx*100)}%"></i></div><span class="num" style="text-align:right">${n}</span></div>`).join('')}</div></div></section>
    <section class="panel"><header><h3>Стан парку</h3></header><div class="pad"><div class="stack">${bySt.map(([s,n])=>`<i style="width:${n/E.length*100}%;background:var(${ST_VAR[s]})" title="${esc(s)}: ${n}"></i>`).join('')}</div>
      <div class="legend">${bySt.map(([s,n])=>`<span style="--c:var(${ST_VAR[s]})">${esc(s)} — <b class="num">${n}</b></span>`).join('')}</div></div>
      <header style="border-top:1px solid var(--line)"><h3>За корпусами</h3></header>${table('corp',[{l:'Корпус',v:c=>esc(c.c),s:c=>c.c},{l:'Приміщень',r:1,v:c=>c.rooms,s:c=>c.rooms},{l:'Одиниць',r:1,v:c=>c.units,s:c=>c.units},{l:'Несправних',r:1,v:c=>c.rep,s:c=>c.rep}],cs)}</section>
  </div>
  <section class="panel"><header><h3>Потребує уваги</h3><span class="sub">${att.length?att.length+' позицій':''}</span></header>${att.length?`<ul class="att">${att.map(a=>`<li>${a[0]}<span>${a[1]}</span></li>`).join('')}</ul>`:'<div class="empty">Усе гаразд: прострочених ремонтів, дефіцитних позицій і ліцензій, що спливають, немає.</div>'}</section>`}

/* ---------- Аудиторії ---------- */
function kit(es){const c={};es.forEach(e=>c[e.type]=(c[e.type]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])}

    const es=S.equipment.filter(e=>e.roomId===r.id);const bad=es.filter(e=>e.status==='У ремонті'||e.status==='Потребує ремонту');
    const mm=MM_TYPES.filter(t=>es.some(e=>e.type===t&&e.status==='В експлуатації'));
    o.innerHTML=`<div class="bar"><button class="btn ghost" id="backRooms">← Усі аудиторії</button></div>
    <section class="panel"><header><div><span class="eyebrow">${esc(r.corp)} · ${esc(r.type||'')}</span><h3 style="font-size:1.3rem">Ауд. ${esc(r.num)}${r.name?' — '+esc(r.name):''}${demo(r)}</h3></div>
      <div class="bar"><button class="btn" id="rptRoom">Сформувати звіт</button>${dl?'<button class="btn" id="xRoom">⤓ Excel</button>':''}${W()?`<button class="btn" id="moveSel" ${sel.size?'':'disabled'}>Перенести вибране${sel.size?' ('+sel.size+')':''}</button><button class="btn" id="editRoom">Редагувати</button><button class="btn pri" id="addEqHere">+ Техніка сюди</button>`:''}</div></header>
      <div class="pad"><dl class="facts"><div><dt>Поверх</dt><dd>${esc(r.floor??'—')}</dd></div><div><dt>Посадкових місць</dt><dd>${esc(r.seats||'—')}</dd></div><div><dt>Закріплено за</dt><dd>${esc(r.resp||'—')}</dd></div>
      <div><dt>Одиниць техніки</dt><dd>${es.length}${bad.length?` · ${pill(bad.length+' несправних','bad')}`:''}</dd></div><div><dt>Мультимедіа в роботі</dt><dd>${mm.length?esc(mm.join(', ')):'немає'}</dd></div>${r.note?`<div><dt>Примітка</dt><dd>${esc(r.note)}</dd></div>`:''}</dl></div>
      ${table('roomEq',eqCols(false,W()),es,{click:1,empty:'У цій аудиторії техніки не закріплено.'})}</section>`;return}
  const rs=roomsFiltered();
  if(!rs.length){o.innerHTML=`<div class="panel"><div class="empty">${S.rooms.length?'За цими умовами аудиторій не знайдено.':loaded.rooms?'Аудиторій ще немає. Додайте першу кнопкою «+ Аудиторія».':'Завантаження…'}</div></div>`;return}
  const groups={};rs.forEach(r=>(groups[r.corp||'Без корпусу']=groups[r.corp||'Без корпусу']||[]).push(r));
  o.innerHTML=Object.keys(groups).sort(cmp).map(c=>`<section class="rgroup"><span class="eyebrow">${esc(c)} · ${groups[c].length}</span><div class="rgrid">${groups[c].sort((a,b)=>cmp(a.num,b.num)).map(r=>{
    const es=S.equipment.filter(e=>e.roomId===r.id),bad=es.filter(e=>e.status==='У ремонті'||e.status==='Потребує ремонту').length;
    return `<button class="rcard" data-room="${esc(r.id)}"><div class="top"><span class="no">${esc(r.num)}</span>${bad?pill(bad+' несправн.','bad'):es.length?pill('справно','ok'):pill('без техніки','idle')}</div>
      <div>${esc(r.name||r.type||'')}${demo(r)}</div><div class="kit">${kit(es).slice(0,4).map(([t,n])=>`<span>${esc(t)} ×${n}</span>`).join('')||'<span>техніку не закріплено</span>'}</div></button>`}).join('')}</div></section>`).join('')}

  const rows=eqFiltered();
  o.innerHTML=`<section class="panel"><header><span class="sub">Знайдено: <b class="num">${rows.length}</b> з ${S.equipment.length}</span><span class="sub">Натисніть на рядок, щоб відкрити картку</span></header>${table('eq',eqCols(),rows,{click:1,empty:S.equipment.length?'За цими умовами техніки не знайдено.':loaded.equipment?'Техніки ще немає. Додайте її вручну або імпортуйте з Excel.':'Завантаження…'})}</section>`}
function specsHtml(s){const ls=(s||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!ls.length)return '<p class="sub">Характеристики не внесено.</p>';
  return `<table class="specs">${ls.map(l=>{const i=l.indexOf(':');return i>0?`<tr><td>${esc(l.slice(0,i))}</td><td>${esc(l.slice(i+1).trim())}</td></tr>`:`<tr><td colspan="2" style="color:var(--ink)">${esc(l)}</td></tr>`}).join('')}</table>`}
function eqCard(id){const e=eqBy.get(id);if(!e)return;const r=eqRoom(e);const hist=S.repairs.filter(x=>x.eqId===id).sort((a,b)=>cmp(b.dateIn,a.dateIn));

    <div><dt>Рік введення</dt><dd>${esc(e.year||'—')}</dd></div><div><dt>Розташування</dt><dd>${esc(roomLabel(r))}</dd></div><div><dt>${e.own?'Власник':'Матеріально відповідальна особа'}</dt><dd>${esc(e.mvo||'—')}</dd></div>
    <div><dt>Обслуговує</dt><dd>${eqDept(e)==='mm'?'Відділ мультимедійного забезпечення':'Відділ супроводу та впровадження'}</dd></div>${e.note?`<div><dt>Примітка</dt><dd>${esc(e.note)}</dd></div>`:''}</dl>
    <div><span class="eyebrow">Технічні характеристики</span>${specsHtml(e.specs)}</div>

  <footer>${W()?`${e.status!=='У ремонті'?`<button class="btn left" id="toRep">Прийняти в ремонт</button>`:''}<button class="btn" id="mvEq">Перенести</button><button class="btn pri" id="edEq">Редагувати</button>`:''}<button class="btn" data-close>Закрити</button></footer></div>`);
  const d=$('#dlg');const a=$('#toRep',d);if(a)a.onclick=()=>formDlg('repairs',null,{eqId:id,dateIn:today(),status:'Прийнято',kind:'Поточний'});const b=$('#edEq',d);if(b)b.onclick=()=>formDlg('equipment',id);const mv=$('#mvEq',d);if(mv)mv.onclick=()=>moveDlg([id])}

  {l:'Техніка',v:r=>{const e=eqBy.get(r.eqId);return e?`${invTag(e)} ${esc(e.name)}${demo(r)}<div class="sub">${esc(roomLabel(eqRoom(e)))}</div>`:'<span class="sub">запис техніки видалено</span>'},s:r=>(eqBy.get(r.eqId)||{}).name},
  {l:'Несправність',v:r=>`${esc(r.problem||'')}${r.work?`<div class="sub">${esc(r.work)}</div>`:''}`},
  {l:'Вид ремонту',v:r=>esc(r.kind||''),s:r=>r.kind},
